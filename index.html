<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Roadmap AR</title><script src='https://aframe.io/releases/1.4.2/aframe.min.js'></script><script src='https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;background:#0008;padding:8px 14px;border-radius:8px;z-index:9}</style></head><body><div id='msg'>Point camera at target</div><a-scene mindar-image='imageTargetSrc: targets.mind; autoStart: true;' embedded vr-mode-ui='enabled:false' device-orientation-permission-ui='enabled:false'><a-assets><video id='vid' src='video.mp4' preload='auto' playsinline webkit-playsinline crossorigin='anonymous'></video></a-assets><a-camera look-controls='enabled:false'></a-camera><a-entity id='target' mindar-image-target='targetIndex:0'><a-video src='#vid' width='1' height='0.5625'></a-video></a-entity></a-scene><script>const t=document.querySelector('#target'),v=document.querySelector('#vid');t.addEventListener('targetFound',async()=>{try{v.currentTime=0;await v.play();msg.style.display='none';}catch(e){}});t.addEventListener('targetLost',()=>v.pause());</script></body></html>
